name: Deploy

# Push-to-deploy for the production VM.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Load SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.VM_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Sync code to VM
        # Same excludes as deploy.command: host-managed infra (Caddyfile,
        # certs), runtime secrets (.env files), and data (uploads, backups)
        # must survive --delete.
        run: |
          rsync -az --delete -e "ssh -i ~/.ssh/deploy_key" \
            --exclude '.git' --exclude 'node_modules' --exclude 'dist' --exclude '.test-build' \
            --exclude 'uploads' --exclude 'deploy/.env' --exclude 'deploy/certs' --exclude 'deploy/deploy.config' \
            --exclude 'deploy/backup.env' --exclude 'deploy/healthcheck.env' \
            --exclude '/Caddyfile' --exclude '/certs' --exclude '*.log' --exclude '/backups' \
            ./ "root@${{ secrets.VM_HOST }}:/opt/opencard/"

      - name: Rolling deploy (zero downtime)
        # 1. Build the new image while the old containers keep serving.
        # 2. Recreate web_a and wait for its healthcheck; Caddy fails over to
        #    web_b meanwhile. If the new image is broken, --wait fails, the
        #    deploy aborts, and the old code keeps running on web_b.
        # 3. Reload Caddy config gracefully (no listener restart).
        # 4. Recreate web_b the same way; Caddy is on web_a (new code) already.
        # 5. Final `up` reconciles the rest (db config, orphans from the old
        #    single-`web` layout).
        run: |
          ssh -i ~/.ssh/deploy_key "root@${{ secrets.VM_HOST }}" bash -s <<'EOF'
          set -euo pipefail
          cd /opt/opencard
          cp deploy/Caddyfile Caddyfile
          DC="docker compose -f deploy/docker-compose.prod.yml"
          $DC build web_a
          $DC up -d db
          $DC up -d --no-deps --wait web_a
          $DC exec -T caddy caddy reload --config /etc/caddy/Caddyfile || $DC up -d caddy
          $DC up -d --no-deps --wait web_b
          $DC up -d --remove-orphans
          EOF

      - name: Smoke test
        run: |
          for i in $(seq 1 12); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 https://opencard.id/healthz || echo 000)
            [ "$code" = "200" ] && echo "healthz OK" && exit 0
            echo "waiting for app (got $code)..."; sleep 10
          done
          echo "deploy smoke test FAILED" && exit 1
