name: Deploy

# Push-to-deploy for the production VM.
#
# The deploy job runs on a SELF-HOSTED runner installed on the VM itself
# (systemd service actions.runner.codebooker-opencard.opencard-vm). It reaches
# out to GitHub, so no inbound SSH is needed — the Hetzner firewall can keep
# port 22 closed to everything except the operator's IP. Tests still run on a
# GitHub-hosted runner.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: test
    runs-on: [self-hosted, opencard-vm]
    steps:
      - uses: actions/checkout@v4

      - name: Sync code into /opt/opencard
        # Local copy on the box. --delete keeps the tree matching git, but the
        # host-managed infra (Caddyfile, certs), runtime secrets (.env files),
        # and data (uploads, backups) are excluded so they survive.
        run: |
          rsync -a --delete \
            --exclude '.git' --exclude 'node_modules' --exclude 'dist' --exclude '.test-build' \
            --exclude 'uploads' --exclude 'deploy/.env' --exclude 'deploy/certs' --exclude 'deploy/deploy.config' \
            --exclude 'deploy/backup.env' --exclude 'deploy/healthcheck.env' \
            --exclude '/Caddyfile' --exclude '/certs' --exclude '*.log' --exclude '/backups' \
            ./ /opt/opencard/

      - name: Rolling deploy (zero downtime)
        # Build the new image while the old containers serve; recreate web_a and
        # wait for its healthcheck (Caddy fails over to web_b); reload Caddy;
        # then web_b. A broken image fails --wait and aborts with old code live.
        run: |
          set -euo pipefail
          cd /opt/opencard
          cp deploy/Caddyfile Caddyfile
          DC="docker compose -f deploy/docker-compose.prod.yml"
          $DC build web_a
          $DC up -d db
          $DC up -d --no-deps --wait web_a
          $DC exec -T caddy caddy reload --config /etc/caddy/Caddyfile || $DC up -d caddy
          $DC up -d --no-deps --wait web_b
          $DC up -d --remove-orphans

      - name: Smoke test
        run: |
          for i in $(seq 1 12); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 https://opencard.id/healthz || echo 000)
            [ "$code" = "200" ] && echo "healthz OK" && exit 0
            echo "waiting for app (got $code)..."; sleep 10
          done
          echo "deploy smoke test FAILED" && exit 1
