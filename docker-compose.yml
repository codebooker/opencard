services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: opencard
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      POSTGRES_DB: opencard
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U opencard -d opencard"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: "postgresql://opencard:${DB_PASSWORD:?Set DB_PASSWORD in .env}@db:5432/opencard?schema=public"
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?Set APP_DB_PASSWORD in .env}
      POSTGRES_DB: opencard
      APP_URL: ${APP_URL:-http://localhost:3000}
      CARD_URL: ${CARD_URL:-}
      COMPANY_NAME: ${COMPANY_NAME:-My Company}
      SESSION_SECRET: ${SESSION_SECRET:?Set SESSION_SECRET in .env}
      SOURCE_URL: ${SOURCE_URL:-https://github.com/codebooker/opencard}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_REGION: ${S3_REGION:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      UPLOAD_DIR: /app/uploads
      BACKUP_DIR: /app/backups
      TRUST_PROXY_HOPS: ${TRUST_PROXY_HOPS:-0}
      SERVER_IPS: ${SERVER_IPS:-}
      TENANTS_CNAME_TARGET: ${TENANTS_CNAME_TARGET:-}
      SCIM_TOKEN: ${SCIM_TOKEN:-}
      AZURE_TENANT_ID: ${AZURE_TENANT_ID:-}
      AZURE_CLIENT_ID: ${AZURE_CLIENT_ID:-}
      AZURE_CLIENT_SECRET: ${AZURE_CLIENT_SECRET:-}
      SELF_SERVICE_DEV_LOGIN: ${SELF_SERVICE_DEV_LOGIN:-0}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
      USERWAY_ACCOUNT: ${USERWAY_ACCOUNT:-off}
      WEBHOOK_DELIVERY_RETENTION_DAYS: ${WEBHOOK_DELIVERY_RETENTION_DAYS:-30}
      SEED_DEMO: ${SEED_DEMO:-0}
      PORT: "3000"
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${PORT:-3000}:3000"
    volumes:
      - uploads_data:/app/uploads
      - ./backups:/app/backups
    command: ["sh", "-ec", "npx prisma migrate deploy && node dist/db-bootstrap.js && node dist/seed.js && exec node dist/server.js"]
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:3000/readyz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s

  # Optional HTTPS reverse proxy. Set APP_DOMAIN and APP_URL, then run
  # docker compose --profile proxy up -d --build.
  caddy:
    profiles: ["proxy"]
    image: caddy:2
    restart: unless-stopped
    depends_on:
      web:
        condition: service_healthy
    environment:
      APP_DOMAIN: ${APP_DOMAIN:-localhost}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  db_data:
  uploads_data:
  caddy_data:
  caddy_config:
