services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: opencard
      POSTGRES_PASSWORD: ${DB_PASSWORD:-opencard}
      POSTGRES_DB: opencard
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U opencard"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: "postgresql://opencard:${DB_PASSWORD:?Set DB_PASSWORD in .env}@db:5432/opencard?schema=public"
      # Password for the least-privilege runtime role (opencard_app) used to
      # enforce Postgres RLS. When unset, the app falls back to the owner
      # connection and RLS is inert (app-level scoping still applies).
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:-}
      POSTGRES_DB: opencard
      BASE_URL: ${BASE_URL:-http://localhost:3000}
      ADMIN_TOKEN: ${ADMIN_TOKEN:?Set ADMIN_TOKEN in .env}
      SCIM_TOKEN: ${SCIM_TOKEN:?Set SCIM_TOKEN in .env}
      SESSION_SECRET: ${SESSION_SECRET:?Set SESSION_SECRET in .env}
      UPLOAD_DIR: /app/uploads
      # Employee self-service SSO (Azure AD / Entra). Leave blank to disable SSO.
      AZURE_TENANT_ID: ${AZURE_TENANT_ID:-}
      AZURE_CLIENT_ID: ${AZURE_CLIENT_ID:-}
      AZURE_CLIENT_SECRET: ${AZURE_CLIENT_SECRET:-}
      # Local testing only: "1" lets employees sign in by typing an email (no IdP).
      SELF_SERVICE_DEV_LOGIN: ${SELF_SERVICE_DEV_LOGIN:-0}
      PORT: "3000"
    ports:
      - "${PORT:-3000}:3000"
    volumes:
      - uploads_data:/app/uploads
    # Apply committed migrations, then seed (idempotent), then start.
    # The `||` fallback baselines a database created before migrations were adopted
    # (tables already exist): mark the initial migration applied, then continue.
    command: >
      sh -c "set -e;
             npx prisma migrate deploy || { npx prisma migrate resolve --applied 0_init && npx prisma migrate deploy; };
             node dist/db-bootstrap.js;
             node dist/seed.js || true;
             exec node dist/server.js"

volumes:
  db_data:
  uploads_data:
