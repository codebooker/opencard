<?xml version="1.0" encoding="UTF-8"?>
<svg width="1600" height="520" viewBox="0 0 1600 520" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">OpenCard Logo</title>
  <desc id="desc">OpenCard logo with a clean stacked digital business card icon and wordmark on a transparent background.</desc>

  <defs>
    <linearGradient id="frontCardGradient" x1="120" y1="370" x2="470" y2="170" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1F5BEA"/>
      <stop offset="55%" stop-color="#18AEE0"/>
      <stop offset="100%" stop-color="#25D1B3"/>
    </linearGradient>

    <linearGradient id="backStrokeGradient" x1="250" y1="175" x2="500" y2="335" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#19C7D0"/>
      <stop offset="100%" stop-color="#27D1B0"/>
    </linearGradient>

    <linearGradient id="pixelGradient" x1="60" y1="120" x2="210" y2="220" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1F5BEA"/>
      <stop offset="100%" stop-color="#16B6D7"/>
    </linearGradient>

    <filter id="softShadow" x="-20%" y="-20%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#12386B" flood-opacity="0.14"/>
    </filter>
  </defs>

  <!-- Transparent background: no background rect -->

  <!-- Digital pixel accents -->
  <rect x="72" y="150" width="34" height="34" rx="6" fill="url(#pixelGradient)"/>
  <rect x="116" y="106" width="31" height="31" rx="6" fill="url(#pixelGradient)"/>
  <rect x="173" y="136" width="42" height="42" rx="8" fill="url(#pixelGradient)"/>

  <!-- Back card 2 -->
  <rect x="245" y="154" width="238" height="164" rx="28"
        fill="none" stroke="url(#backStrokeGradient)" stroke-width="22"/>

  <!-- Back card 1 -->
  <rect x="206" y="181" width="238" height="164" rx="28"
        fill="none" stroke="#20C3C7" stroke-width="22" opacity="0.95"/>

  <!-- Front card -->
  <rect x="150" y="214" width="320" height="190" rx="34"
        fill="url(#frontCardGradient)" filter="url(#softShadow)"/>

  <!-- White icon on the front card -->
  <circle cx="230" cy="284" r="29" fill="#FFFFFF"/>
  <path d="M176 352 C178 318 201 300 230 300 C259 300 282 318 284 352 Z" fill="#FFFFFF"/>
  <rect x="314" y="267" width="127" height="19" rx="9.5" fill="#FFFFFF"/>
  <rect x="314" y="315" width="127" height="19" rx="9.5" fill="#FFFFFF"/>

  <!-- Wordmark -->
  <text x="565" y="353"
        font-family="Inter, Montserrat, Avenir Next, Helvetica Neue, Arial, sans-serif"
        font-size="174"
        font-weight="700"
        letter-spacing="-7"
        fill="#123A70">OpenCard</text>
</svg>
