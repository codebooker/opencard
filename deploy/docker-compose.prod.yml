# Production stack for OpenCard.
#   db          — PostgreSQL 16 (persistent volume)
#   web_a/web_b — two instances of the app (migrate -> bootstrap RLS role ->
#                 seed -> serve on :3000, internal). Two so deploys can restart
#                 them one at a time behind Caddy: zero-downtime deploys.
#                 Concurrent `prisma migrate deploy` is safe (advisory lock).
#   caddy       — TLS reverse proxy for opencard.id (+ *.opencard.id) and
#                 tapshare.cards; health-checks both web upstreams and fails over.
#   portainer   — container management UI, bound to localhost only (SSH-tunnel to reach it)
#
# Reads secrets from a .env file in this directory. See .env.prod.example.
name: opencard

# Shared definition for the two web instances. web_a owns the image build;
# web_b reuses the same tag, so one build serves both.
x-web: &web
  image: opencard-web
  restart: unless-stopped
  depends_on:
    db:
      condition: service_healthy
  environment: &web-env
    DATABASE_URL: "postgresql://opencard:${DB_PASSWORD}@db:5432/opencard?schema=public"
    APP_DB_PASSWORD: ${APP_DB_PASSWORD:?Set APP_DB_PASSWORD in deploy/.env}
    POSTGRES_DB: opencard
    NODE_ENV: production
    APP_URL: ${APP_URL:?Set APP_URL (e.g. https://opencard.id)}
    CARD_URL: ${CARD_URL:?Set CARD_URL (e.g. https://tapshare.cards)}
    PLATFORM_DOMAIN: ${PLATFORM_DOMAIN:-}
    # ADMIN_TOKEN removed: the god-token break-glass path was decommissioned.
    # Admin bootstrap/recovery is now `node dist/scripts/make-admin.js` on the box.
    SCIM_TOKEN: ${SCIM_TOKEN:?Set SCIM_TOKEN in deploy/.env}
    SESSION_SECRET: ${SESSION_SECRET:?Set SESSION_SECRET in deploy/.env}
    UPLOAD_DIR: /app/uploads
    # Off by default: opt in with SIGNUPS_ENABLED=1 in deploy/.env once SMTP is
    # configured. Without SMTP the app blocks signups in production anyway
    # (magic-link verification is required — no auto-verified accounts).
    SIGNUPS_ENABLED: ${SIGNUPS_ENABLED:-0}
    SEED_DEMO: ${SEED_DEMO:-0}
    AZURE_TENANT_ID: ${AZURE_TENANT_ID:-}
    AZURE_CLIENT_ID: ${AZURE_CLIENT_ID:-}
    AZURE_CLIENT_SECRET: ${AZURE_CLIENT_SECRET:-}
    STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
    STRIPE_PUBLISHABLE_KEY: ${STRIPE_PUBLISHABLE_KEY:-}
    STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
    STRIPE_PRICE_TEAM: ${STRIPE_PRICE_TEAM:-}
    STRIPE_PRICE_DEALER_GROUP: ${STRIPE_PRICE_DEALER_GROUP:-}
    STRIPE_PRICE_ENTERPRISE: ${STRIPE_PRICE_ENTERPRISE:-}
    SMTP_HOST: ${SMTP_HOST:-}
    SMTP_PORT: ${SMTP_PORT:-}
    SMTP_USER: ${SMTP_USER:-}
    SMTP_PASS: ${SMTP_PASS:-}
    SMTP_FROM: ${SMTP_FROM:-}
    # Proxy hops in front of the app for client-IP resolution (rate limits,
    # logs, audit). This deploy is client -> Cloudflare -> Caddy -> app = 2.
    TRUST_PROXY_HOPS: ${TRUST_PROXY_HOPS:-2}
    # Staff console backup & restore page reads/writes the host backup dir.
    BACKUP_DIR: /app/backups
    PORT: "3000"
  volumes:
    - uploads_data:/app/uploads
    - /opt/opencard/backups:/app/backups
  command: >
    sh -c "set -e;
           npx prisma migrate deploy || { npx prisma migrate resolve --applied 0_init && npx prisma migrate deploy; };
           node dist/db-bootstrap.js;
           node dist/seed.js || true;
           exec node dist/server.js"
  # Deploys use `up --wait`: the new container must pass this before the old
  # sibling is touched. start_period covers migrate+bootstrap at boot.
  healthcheck:
    test: ["CMD-SHELL", "node -e \"fetch('http://localhost:3000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
    interval: 5s
    timeout: 5s
    retries: 6
    start_period: 45s

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: opencard
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in deploy/.env}
      POSTGRES_DB: opencard
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U opencard"]
      interval: 5s
      timeout: 5s
      retries: 10

  web_a:
    <<: *web
    build:
      context: ..
      dockerfile: Dockerfile

  web_b:
    <<: *web

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - web_a
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # Caddyfile + certs are bound from stable ABSOLUTE host paths, not from the
      # git clone. Portainer keeps clones inside its own volume, so relative
      # bind-mounts resolve to a path the Docker daemon can't see on the host.
      # Infra config (proxy + TLS) lives on the host; app code is built from git.
      - /opt/opencard/Caddyfile:/etc/caddy/Caddyfile:ro
      - /opt/opencard/certs:/certs:ro
      - caddy_data:/data
      - caddy_config:/config

# NOTE: Portainer runs as a SEPARATE standalone container (not part of this
# stack), so it can manage/redeploy this stack from git without tearing itself
# down. See deploy/README.md for the one-line `docker run` that starts it.

volumes:
  db_data:
  uploads_data:
  caddy_data:
  caddy_config:
