#cloud-config
# OpenCard host bootstrap for a fresh Hetzner Ubuntu VM (target: CX33).
# Paste this into Hetzner Cloud Console → Create Server → "Cloud config" (user
# data). It brings the box up to the same state as deploy/bootstrap.sh —
# Docker + compose, firewall, swap, dirs, basic hardening — so it's ready for a
# deploy/restore the moment it finishes first boot.
#
# It intentionally installs NO secrets and NO app code. Those come afterward:
# copy deploy/.env + certs + backup.env from the old box, then restore the DB
# and uploads from Wasabi (see deploy/MIGRATION.md). Add your SSH key in the
# Hetzner console UI so you can log in.

hostname: opencard
timezone: UTC

package_update: true
package_upgrade: true

packages:
  - ca-certificates
  - curl
  - gnupg
  - ufw
  - fail2ban
  - rsync
  - git
  - unattended-upgrades

# 2 GB swap — cheap insurance so a memory spike (Postgres + two web workers +
# a build) can't OOM-kill the box. CX33 has 8 GB RAM; this is just a cushion.
swap:
  filename: /swapfile
  size: 2147483648
  maxsize: 2147483648

# Password SSH off; key-only (add your key in the Hetzner console).
ssh_pwauth: false

write_files:
  # Keep unattended security upgrades on (auto-reboot in a quiet window if a
  # kernel/security patch needs it).
  - path: /etc/apt/apt.conf.d/51unattended-upgrades-local
    content: |
      Unattended-Upgrade::Automatic-Reboot "true";
      Unattended-Upgrade::Automatic-Reboot-Time "04:30";

runcmd:
  # --- Docker Engine + compose plugin (official convenience script) ---
  - [ sh, -c, "command -v docker >/dev/null 2>&1 || curl -fsSL https://get.docker.com | sh" ]
  - systemctl enable --now docker

  # --- Firewall: SSH + HTTP + HTTPS only ---
  - ufw allow OpenSSH
  - ufw allow 80/tcp
  - ufw allow 443/tcp
  - sh -c "yes | ufw enable"
  # Optional hardening (uncomment + set your IP to restrict SSH to you):
  # - ufw delete allow OpenSSH
  # - ufw allow from YOUR.IP.ADDR.HERE to any port 22 proto tcp

  # --- App directories (match deploy/docker-compose.prod.yml bind mounts) ---
  - mkdir -p /opt/opencard/deploy/certs /opt/opencard/certs /opt/opencard/backups

  # --- fail2ban on by default (ships an sshd jail) ---
  - systemctl enable --now fail2ban

  # Marker so you can confirm cloud-init finished: `cat /opt/opencard/.ready`
  - sh -c "echo \"cloud-init ready $(date -u)\" > /opt/opencard/.ready"

final_message: "OpenCard host ready after $UPTIME s. Next: copy secrets/certs + restore from Wasabi (deploy/MIGRATION.md)."
